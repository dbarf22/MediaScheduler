<!DOCTYPE html>
<html lang="en" xmlns:x-on="http://www.w3.org/1999/xhtml">
  <head>
    <meta charset="utf-8" />
    <title>Scheduler</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />

    <!-- Stylesheets -->
    <link rel="stylesheet" href="styles.css" />

    <!-- Scripts -->
    <script src="script.js"></script>
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"
    ></script>
  </head>

  <body x-data="scheduler">
    <!-- ======================================================================
         NAV BAR
         ====================================================================== -->
    <header class="navbar">
      <div class="navbar-row">
        <label for="sessions">Select a session to control: </label>
        <select
          class="top-input"
          name="sessions"
          id="sessions"
          x-model="selectedSessionId"
        >
          <option value="">Select a session</option>
          <template x-for="session in sessions" :key="session.Id">
            <template x-if="session.SupportsRemoteControl">
              <option
                :value="session.Id"
                x-text="session.Client + ' - ' + session.DeviceName"
              ></option>
            </template>
          </template>
        </select>
      </div>
    </header>

    <!-- ======================================================================
         NO DEVICE SELECTED
         ====================================================================== -->
    <template x-if="selectedSessionId === ''">
      <div class="no-device-screen">
        <h1>Select a device to begin</h1>
      </div>
    </template>

    <!-- ======================================================================
         MAIN CONTENT (only once a device is selected)
         ====================================================================== -->
    <template x-if="selectedSessionId !== ''">
      <div>
        <!-- Scheduled items -->
        <div class="schedule-list">
          <template x-for="item in scheduleList">
            <div class="schedule-item">
              <strong x-text="item.title" class="schedule-item-title"></strong>
              <i
                x-text="'scheduled to play at ' + item.date"
                class="schedule-description"
              ></i>
              <button
                x-on:click="await removeFromSchedule(item.jobId); scheduleList = await getSchedule()"
              >
                Remove
              </button>
            </div>
          </template>
        </div>

        <!-- Movies / Series switcher + search -->
        <div x-data="{ showMovies: true }">
          <div class="media-type-selector">
            <button
              type="button"
              :class="showMovies ? 'media-type-button selected' : 'media-type-button'"
              x-on:click="showMovies = true"
            >
              Movies
            </button>

            <button
              type="button"
              :class="!showMovies ? 'media-type-button selected' : 'media-type-button'"
              x-on:click="showMovies = false"
            >
              Series
            </button>

            <search>
              <form class="media-search-bar" x-on:submit.prevent="">
                <label for="media-search">Search:</label>
                <input type="search" id="media-search" />
                <button>Search</button>
              </form>
            </search>
          </div>

          <!-- Movie cards -->
          <ul class="poster-grid" x-show="showMovies">
            <template x-for="movie in movies" :key="movie.Id">
              <div
                class="media-card"
                x-on:click="
                  contentIsSelected = true;
                  contentIsSeries = false;
                  selectedContentId = movie.Id;
                  selectedContentName = movie.Name;
                  selectedContentPoster = movie.posterLink"
              >
                <img
                  class="poster"
                  :src="movie.posterLink"
                  :alt="movie.Name"
                  :title="movie.Name"
                />
                <div class="media-card-text">
                  <div class="media-card-title-line">
                    <p class="card-titles" x-text="movie.Name"></p>
                  </div>
                  <div class="media-card-date-line">
                    <p x-text="movie.ProductionYear"></p>
                  </div>
                </div>
              </div>
            </template>
          </ul>

          <!-- Series cards -->
          <ul class="poster-grid" x-show="!showMovies">
            <template x-for="show in shows" :key="show.Id">
              <div
                class="media-card"
                x-on:click="
                  contentIsSelected = true;
                  contentIsSeries = true;
                  selectedContentId = show.Id;
                  selectedContentName = show.Name;
                  selectedContentPoster = show.posterLink;
                  selectedSeriesEpisodes = await getSeriesEpisodes(selectedContentId);
                  selectedSeason = selectedSeriesEpisodes?.[0]"
              >
                <img
                  class="poster"
                  :src="show.posterLink"
                  :alt="show.Name"
                  :title="show.Name"
                />
                <div class="media-card-text">
                  <div class="media-card-title-line">
                    <p class="card-titles" x-text="show.Name"></p>
                  </div>
                  <div class="media-card-date-line">
                    <p x-text="show.ProductionYear"></p>
                  </div>
                </div>
              </div>
            </template>
          </ul>
        </div>
      </div>
    </template>

    <!-- ======================================================================
         SCHEDULE MODAL
         ====================================================================== -->
    <div
      x-show="contentIsSelected"
      class="modal"
      x-transition:enter="modal-entering"
      x-transition:enter-start="modal-hidden"
      x-transition:leave="modal-leaving"
      x-transition:leave-end="modal-hidden"
    >
      <div class="modal-backdrop" x-on:click="closeModal()"></div>

      <!-- Movie option -->
      <div x-show="!contentIsSeries" class="selected-content-card">
        <div class="selected-content-top">
          <p>Schedule Movie</p>
        </div>

        <div class="selected-content-middle">
          <div class="selected-content-info-pane">
            <img
              class="selected-content-poster"
              :src="selectedContentPoster"
              :alt="selectedContentName"
              :title="selectedContentName"
            />
            <p class="selected-content-name" x-text="selectedContentName"></p>
          </div>

          <div class="selected-content-date-pane">
            <label for="dates">Select a date and time:</label>
            <input
              class="date-input"
              name="dates"
              id="dates"
              type="datetime-local"
              x-model="selectedDateTime"
              :min="earliestDateTime()"
            />
            <p x-show="showError" x-text="errorText" class="error-text"></p>
          </div>
        </div>
        <div class="selected-content-bottom">
          <button class="back-button" x-on:click="closeModal()">Go Back</button>

          <button
            class="submit-button"
            x-on:click="isAwaitingSchedulePost = true;
            clearError();

            try {
              if (isDateValid(selectedDateTime) && await schedule(selectedDateTime, selectedSessionId, selectedContentId, selectedContentName)) {
                closeModal();
                scheduleList = await getSchedule();
              }
            } catch (error) {
              setError(error.message);
            }
            finally {
              isAwaitingSchedulePost = false;
            }"
            :disabled="!isDateValid(selectedDateTime) || isAwaitingSchedulePost || !selectedDateTime || !selectedSessionId"
          >
            Submit
          </button>

        </div>

      </div>

      <!-- Series option -->
      <div x-show="contentIsSeries" class="selected-content-card">
        <div class="selected-content-top">
          <p>Schedule Episode</p>
        </div>

        <div class="selected-content-middle">
          <div class="selected-content-info-pane">
            <img
              class="selected-content-poster"
              :src="selectedContentPoster"
              :alt="selectedContentName"
              :title="selectedContentName"
            />
            <p class="selected-content-name" x-text="selectedContentName"></p>
          </div>

          <div class="selected-content-date-pane">
            <div class="season-episode-selector">
              <div class="season-row">
                <template x-for="season in selectedSeriesEpisodes" >
                  <button x-text="'Season ' + season.season" type="button" x-on:click="selectedSeason = season"
                    :class="selectedSeason != season ? 'season-button' : 'season-button season-button-selected'"></button>
                </template>
              </div>
              <div class="episode-column">
                <template x-for="episode in selectedSeason?.episodes ?? []" >
                  <button type="button" x-on:click="selectedEpisode = episode.id"
                          :class="selectedEpisode != episode.id ? 'episode-button' : 'episode-button episode-button-selected' "  >
                    <span class="episode-number" x-text="episode.episode != null ? 'E' + episode.episode : ''"></span>
                    <span class="episode-name" x-text="episode.name"></span>
                  </button>
                </template>
              </div>
            </div>

            <label for="seriesDates">Select a date and time:</label>
            <input
              class="date-input"
              name="dates"
              id="seriesDates"
              type="datetime-local"
              x-model="selectedDateTime"
              :min="earliestDateTime()"
            />
            <p x-show="showError" x-text="errorText" class="error-text"></p>
          </div>
        </div>

        <div class="selected-content-bottom">
          <button class="back-button" x-on:click="closeModal()">Go Back</button>

          <button
            class="submit-button"
            x-on:click="
            isAwaitingSchedulePost = true;
            clearError();

            try {
              if (isDateValid(selectedDateTime) && await scheduleShow(selectedDateTime, selectedSessionId, selectedEpisode, selectedContentName)) {
                closeModal();
                scheduleList = await getSchedule();
              }
            } catch (error) {
              setError(error.message);
            } finally {
              isAwaitingSchedulePost = false;
            }"
            :disabled="!isDateValid(selectedDateTime) || isAwaitingSchedulePost || !selectedDateTime || !selectedSessionId || !selectedEpisode"
          >
            Submit
          </button>
        </div>
      </div>
    </div>



  </body>
</html>
