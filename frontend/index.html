<html lang="en">
  <head>
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"
    ></script>
    <title>Scheduler</title>
    <script src="script.js"></script>
    <link rel="stylesheet" href="styles.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css"
    />
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
  </head>

  <body
    x-data="{sessions : [], movies : [],
                    selectedSessionId : '', selectedDateTime : '',
                    selectedContentId : '', selectedContentName : '',
                    scheduleList : []}"
    x-init="sessions = await getSessions(); movies = await getLibrary(); scheduleList = await getSchedule();"
  >
    <header>
      <label for="sessions">Select a session to control: </label>

      <select name="sessions" id="sessions" x-model="selectedSessionId">
        <option>Select a session from below</option>
        <template x-for="session in sessions" :key="session.Id">
          <template x-if="session.SupportsRemoteControl">
            <option
              x-bind:value="session.Id"
              x-text="session.Client + ' - ' + session.DeviceName "
            ></option>
          </template>
        </template>
      </select>

      <label for="dates">Select a date and time</label>
      <input name="dates" id="dates" type="text" x-model="selectedDateTime" />
      <script>
        flatpickr("#dates", {
          altInput: true,
          altFormat: "F j, Y, h:i K",
          enableTime: true,
          dateFormat: "Z",
          defaultDate: "today",
          minDate: "today",
        });
      </script>

      <button
        x-on:click="schedule(selectedDateTime, selectedSessionId, selectedContentId, selectedContentName)"
      >
        Press me
      </button>
    </header>

    <div>
      <template x-for="item in scheduleList">
        <p x-text="item.title + ' is playing at ' + item.date"></p>
        <br />
      </template>
    </div>

    <!-- Load movies, ids, posters -->
    <ul class="container">
      <template x-for="movie in movies">
        <li class="movieCard">
          <img x-bind:src="movie.posterLink" alt="movie.Name" class="poster" />
          <button
            x-on:click="selectedContentId=movie.Id; selectedContentName=movie.Name"
          >
            Play me
          </button>
        </li>
      </template>
    </ul>
  </body>
</html>
