<html lang="en">
  <head>
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"
    ></script>
    <title>Scheduler</title>
    <script src="script.js"></script>
    <link rel="stylesheet" href="styles.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css"
    />
    <link rel="stylesheet" type="text/css" href="https://npmcdn.com/flatpickr/dist/themes/dark.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
  </head>

  <body
    x-data="{sessions : [], movies : [], shows : [],
                    selectedSessionId : '', selectedDateTime : '',
                    selectedContentId : '', selectedContentName : '',
                    scheduleList : []}"
    x-init="sessions = await getSessions(); movies = await getLibrary();
    scheduleList = await getSchedule(); shows = await getLibraryShows()"
  >
    <header class="navbar">
      <div class="inputRow">
        <label for="sessions">Select a session to control: </label>
        <select class="topInput" name="sessions" id="sessions" x-model="selectedSessionId">
          <option>Select a session</option>
          <template x-for="session in sessions" :key="session.Id">
            <template x-if="session.SupportsRemoteControl">
              <option
                x-bind:value="session.Id"
                x-text="session.Client + ' - ' + session.DeviceName "
              ></option>
            </template>
          </template>
        </select>
      </div>

      <div class="inputRow">
        <label for="dates">Select a date and time:</label>
        <input class="topInput" name="dates" id="dates" type="text" x-model="selectedDateTime" />
      </div>

      <button id="submitButton"
        x-on:click="schedule(selectedDateTime, selectedSessionId, selectedContentId, selectedContentName);
                    scheduleList = await getSchedule()"
      >
        Submit
      </button>
    </header>

    <div class="scheduleList">
      <template x-for="item in scheduleList">
        <div class="scheduleItem">
          <strong x-text="item.title" class="scheduleItemTitle"></strong>
          <i x-text="'scheduled to play at ' + item.date" class="scheduleDescription"></i>
          <button x-on:click="removeFromSchedule(item.jobId); scheduleList = await getSchedule() ">Remove</button>
        </div>
      </template>
    </div>


    <!-- Load movies, ids, posters -->
    <div x-data="{showMovies : true}">
      <button x-on:click="showMovies = !showMovies">Toggle</button>
      <ul class="container"  x-show="showMovies">
      <template x-for="movie in movies" :key="movie.Id">
          <div :class="selectedContentId===movie.Id ? 'selectedMovieCard' : 'movieCard'">
            <img
              :src="movie.posterLink"
              :alt="movie.Name"
              :title="movie.Name"
              class="poster"
              x-on:click="selectedContentId=movie.Id; selectedContentName=movie.Name"
            />
            <p x-text="movie.Name" class="cardTitles"></p>
          </div>
      </template>
      </ul>

      <ul class="container" x-show="!showMovies">
      <template x-for="show in shows" :key="show.Id">
          <div :class="selectedContentId===show.Id ? 'selectedMovieCard' : 'movieCard'">
            <img
              :src="show.posterLink"
              :alt="show.Name"
              :title="show.Name"
              class="poster"
              x-on:click="selectedContentId=show.Id; selectedContentName=show.Name"
            />
            <p x-text="show.Name" class="cardTitles"></p>
          </div>
      </template>
      </ul>
    </div>

    <script>
      flatpickr("#dates", {
        altInput: true,
        altFormat: "F j, Y, h:i K",
        enableTime: true,
        dateFormat: "Z",
        defaultDate: "today",
        minDate: "today",
      });
    </script>
  </body>
</html>
