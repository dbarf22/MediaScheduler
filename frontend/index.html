<html lang="en">
    <head>
        <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
        <title>Scheduler</title>
        <script src="script.js"></script>
        <link rel="stylesheet" href="styles.css">
    </head>

    <body x-data="{sessions : [], movies : [], selectedSessionId : ''}"
          x-init="sessions = await getSessions();
           movies = await getLibrary();">

            <label for="sessions">Select a session to control: </label>

            <select name="sessions" id="sessions" x-model="selectedSessionId">
                <option>Select a session from below</option>
                <template x-for="session in sessions" :key="session.Id">
                    <template x-if="session.SupportsRemoteControl">
                        <option x-bind:value="session.Id" x-text="session.Client + ' - ' + session.DeviceName "></option>
                    </template>
                </template>
            </select>

            <button x-on:click="console.log(selectedSessionId)" >Press me</button>

        <!-- Loads movies, ids, posters -->
            <ul class="container">
                <template x-for="movie in movies"  >
                    <li class="movieCard">
                        <img x-bind:src="movie.posterLink" alt="movie.Name" class="poster">
                        <button x-on:click="playContent(selectedSessionId, movie.Id)">Play me</button>
                    </li>
                </template>
            </ul>

    </body>

</html>
