<!DOCTYPE html>
<html lang="en" xmlns:x-on="http://www.w3.org/1999/xhtml" xmlns:x-bind="http://www.w3.org/1999/xhtml">
  <head>
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"
    ></script>
    <title>Scheduler</title>
    <script src="script.js"></script>
    <link rel="stylesheet" href="styles.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css"
    />
    <link
      rel="stylesheet"
      type="text/css"
      href="https://npmcdn.com/flatpickr/dist/themes/dark.css"
    />
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
  </head>

  <body
    x-data="{sessions : [], movies : [], shows : [],
                    selectedSessionId : '', selectedDateTime : '',
                    selectedContentId : '', selectedContentName : '',
                    scheduleList : [], contentIsSelected : false, selectedContentPoster : '',
                    selectedSeriesEpisodes : [], contentIsSeries: false, selectedEpisode: ''}"
    x-init="sessions = await getSessions(); movies = await getLibrary();
    scheduleList = await getSchedule(); shows = await getLibraryShows(); console.log(sessions)"
  >

    <template x-if="selectedSessionId === ''">
      <div
        class="selectScreenBackground"
      ></div>
    </template>

    <!-- NAV BAR --------------------------- -->
    <header class="navbar">
      <div class="navbarRow">
        <label for="sessions">Select a session to control: </label>
        <select
          class="topInput"
          name="sessions"
          id="sessions"
          x-model="selectedSessionId"
        >
          <option value="">Select a session</option>
          <template x-for="session in sessions" :key="session.Id">
            <template x-if="session.SupportsRemoteControl">
              <option
                x-bind:value="session.Id"
                x-text="session.Client + ' - ' + session.DeviceName"
              ></option>
            </template>
          </template>
        </select>
      </div>
    </header>

    <template x-if="selectedSessionId !== ''">
      <!-- Load movies ids and posters --------------------- -->
    <div>
      <div>
        <div class="scheduleList">
          <template x-for="item in scheduleList">
            <div class="scheduleItem">
              <strong x-text="item.title" class="scheduleItemTitle"></strong>
              <i
                x-text="'scheduled to play at ' + item.date"
                class="scheduleDescription"
              ></i>
              <button
                x-on:click="removeFromSchedule(item.jobId); scheduleList = await getSchedule() "
              >
                Remove
              </button>
            </div>
          </template>
        </div>

        <!-- CHOOSE SERIES AND MOVIES BAR -------------------->

        <div x-data="{showMovies : true}">
          <div class="mediaTypeSelector">
            <h1
              :class="showMovies ? 'selectedMediaTypeButton' : 'mediaTypeButton'"
              x-on:click="showMovies = true"
            >
              Movies
            </h1>
            <h1
              :class="!showMovies ? 'selectedMediaTypeButton' : 'mediaTypeButton'"
              x-on:click="showMovies = false"
            >
              Series
            </h1>
          </div>

          <!-- POPULATED MOVIE CARDS ----------- -->

          <ul class="container" x-show="showMovies">
            <template x-for="movie in movies" :key="movie.Id">
              <div
                :class="'movieCard'"
                x-on:click="contentIsSelected = true; contentIsSeries=false"
                x-on:mouseover="selectedContentId=movie.Id; selectedContentName=movie.Name;
					selectedContentPoster=movie.posterLink"
              >
                <img
                  :src="movie.posterLink"
                  :alt="movie.Name"
                  :title="movie.Name"
                  class="poster"
                />
                <div class="movieCardText">
                  <div class="movieCardTitleLine">
                    <p x-text="movie.Name" class="cardTitles"></p>
                  </div>
                  <div class="movieCardDateLine">
                    <p x-text="movie.ProductionYear"></p>
                  </div>
                </div>
              </div>
            </template>
          </ul>

          <!-- POPULATED SERIES CARDS --------------- -->

          <ul class="container" x-show="!showMovies">
            <template x-for="show in shows" :key="show.Id">
              <div
                :class="'movieCard'"
                x-on:click="contentIsSelected = true; contentIsSeries=true"
                x-on:mouseover="selectedContentId=show.Id; selectedContentName=show.Name;
					selectedContentPoster=show.posterLink;
					selectedSeriesEpisodes = await getSeriesEpisodes(selectedContentId)"
              >
                <img
                  :src="show.posterLink"
                  :alt="show.Name"
                  :title="show.Name"
                  class="poster"
                />
                <div class="movieCardText">
                  <div class="movieCardTitleLine">
                    <p x-text="show.Name" class="cardTitles"></p>
                  </div>
                  <div class="movieCardDateLine">
                    <p x-text="show.ProductionYear"></p>
                  </div>
                </div>
              </div>
            </template>
          </ul>
        </div>
      </div>
    </div>
    </template>

    <!-- MENU FOR SHOWING SELECTED CONTENT. Split btwn movie and series option -->

    <div x-show="contentIsSelected" class="modal">
      <div
        class="selectScreenBackground"
        x-on:click="selectedContentId=''; selectedContentName='';
                selectedContentPoster=''; contentIsSelected = false; contentIsSeries=false"
      ></div>

      <!-- MOVIE OPTION ------------------ -->
      <div x-show="!contentIsSeries" class="selectedContentCard">

        <!-- top menu bar -->
        <div class="selectedContentTop">
          <p>Schedule Movie</p>
        </div>

        <!-- middle content section -->
        <div class="selectedContentMiddle">
          <div class="selectedContentInfoPane">
            <img
              :src="selectedContentPoster"
              :alt="selectedContentName"
              :title="selectedContentName"
              class="selectedContentPoster"
            />
            <p x-text="selectedContentName" class="selectedContentName"></p>
          </div>

        <div class="selectedContentDatePane">

          <label for="dates">Select a date and time:</label>
            <input
              class="dateInput"
              placeholder="M/D/YYYY HH:MM"
              name="dates"
              id="dates"
              type="text"
              x-model="selectedDateTime"
               x-init="flatpickr('#dates', {
        altInput: true,
        altFormat: 'n/j/Y, h:i K',
        enableTime: true,
        dateFormat: 'Z',
        minDate: 'today',
        onChange: function(selectedDates, dateStr, instance) {selectedDateTime = dateStr; console.log(dateStr)}
      });"
            />
        </div>
        </div>

        <!-- Bottom button row -->
          <div class="selectedContentBottom">


          <button class="backButton"
            x-on:click="selectedContentId=''; selectedContentName='';
                selectedContentPoster=''; contentIsSelected = false; contentIsSeries=false;"
          >
            Go Back
          </button>

            <button
            class="submitButton"
            x-on:click="schedule(selectedDateTime, selectedSessionId, selectedContentId, selectedContentName);
                    scheduleList = await getSchedule()"
            :disabled="!selectedDateTime || !selectedSessionId "

          >
            Submit
          </button>
          </div>

      </div>

      <!-- SERIES OPTION ----------------- -->

      <div x-show="contentIsSeries" class="selectedContentCard">
        <div class="selectedContentTop">
          <p>Schedule Episode</p>
        </div>

        <div class="selectedContentMiddle">
          <div class="selectedContentInfoPane">
          <img
            :src="selectedContentPoster"
            :alt="selectedContentName"
            :title="selectedContentName"
            class="selectedContentPoster"
          />
          <p x-text="selectedContentName" class="selectedContentName"></p>
        </div>

        <div class="selectedContentDatePane">
          <div class="selectEpisode">

          </div>

            <div class="inputRow">
              <label for="seasons">Select an episode: </label>
          <select
              name="seasons"
              class="seasonSelector"
              x-model="selectedEpisode"
              id="seasons"
            >
              <option value="">--choose--</option>
              <template x-for="season in selectedSeriesEpisodes">
                <optgroup :label="'Season ' + season.season">
                  <template x-for="episode in season.episodes">
                    <option :value="episode.id" x-text="episode.name"></option>
                  </template>
                </optgroup>
              </template>
            </select>
              <label for="seriesDates">Select a date and time:</label>
              <input
                class="dateInput"
                placeholder="M/D/YYYY HH:MM"
                name="dates"
                id="seriesDates"
                type="date"
                x-model="selectedDateTime"
                x-init="flatpickr('#seriesDates', {
        altInput: true,
        altFormat: 'n/j/Y, h:i K',
        enableTime: true,
        dateFormat: 'Z',
        minDate: 'today',
        onChange: function(selectedDates, dateStr, instance) {selectedDateTime = dateStr; console.log(dateStr)}
      });"
              />
            </div>
        </div>
      </div>
        <div class="selectedContentBottom">
              <button
                x-on:click="selectedContentId=''; selectedContentName='';
                  selectedContentPoster=''; contentIsSelected = false; contentIsSeries=false;"
                class="backButton"
              >
                Go Back
              </button>

                <button
                class="submitButton"
                x-on:click="scheduleShow(selectedDateTime, selectedSessionId, selectedEpisode, selectedContentName);
                      scheduleList = await getSchedule()"
              :disabled="!selectedDateTime || !selectedSessionId || !selectedEpisode"

              >
                Submit
              </button>


            </div>
    </div>

    <!-- Flatpickr script -->
    <!-- todo: Check that it works after selecting multiple shows & movies -->

    <script>

    </script>

  </body>
</html>
